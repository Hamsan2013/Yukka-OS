name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential grub-pc-bin grub-common xorriso mtools qemu-system-x86

      - name: Build ISO
        run: make iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Yukka-OS.iso
          path: Yukka-OS.iso

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/**/*.log
          if-no-files-found: ignore
