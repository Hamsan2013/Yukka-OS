name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Prevents 14+ minute hangs

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools \
            qemu-system-x86

      - name: Build ISO
        run: make iso
        timeout-minutes: 5  # ISO build should take <2 min

      - name: Verify ISO exists
        run: |
          if [ ! -f Yukka-OS.iso ]; then
            echo "ERROR: Yukka-OS.iso was not created"
            exit 1
          fi
          ls -lh Yukka-OS.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Yukka-OS.iso
          path: Yukka-OS.iso

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/**/*.log
          if-no-files-found: ignore
